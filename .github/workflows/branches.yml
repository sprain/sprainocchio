name: Delete merged branches

# GitHub's setting «Automatically delete head branches» cannot be changed from Claude's sessions, so this
# does the same: after a merged pull request it deletes the head branch, and when started by hand it deletes
# every branch that is fully contained in the default branch. Only branches with no commits beyond the
# default branch are deleted; the default branch and «statistik» are never touched.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT: ${{ github.event.repository.default_branch }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Delete
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            branches=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          else
            branches="$HEAD_REF"
          fi
          for b in $branches; do
            if [ "$b" = "$DEFAULT" ] || [ "$b" = statistik ]; then continue; fi
            ahead=$(gh api "repos/$REPO/compare/$DEFAULT...$b" --jq .ahead_by) || continue
            if [ "$ahead" = 0 ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "deleted $b"
            else
              echo "kept $b ($ahead commits not in $DEFAULT)"
            fi
          done
