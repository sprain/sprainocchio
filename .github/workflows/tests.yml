name: Tests

# Every change reaches master through a pull request. A merge into master that adds a new
# version at the top of CHANGELOG.md tags it and publishes a release.
on:
  push:
    branches: [master, 'claude/**']
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit

      # A pull request that changes the engine needs a new version in CHANGELOG.md
      - name: Check version
        if: github.event_name == 'pull_request'
        run: |
          version=$(grep -m 1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(src/|bin/|themes/|builder\.php$|composer\.json$)' \
              && git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::This pull request changes the engine, but $version is already released. Add a new version at the top of CHANGELOG.md."
            exit 1
          fi

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m 1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already released."
            exit 0
          fi
          awk -v v="$version" '$0 ~ "^## " v { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
